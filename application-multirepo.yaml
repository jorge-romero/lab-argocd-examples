apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multirepo-app
  namespace: argocd
spec:
  project: argocdexample-project
  sources:
    - repoURL: https://github.com/jorge-romero/lab-argocd-examples.git
      path: app
      targetRevision: dev
    - repoURL: "https://github.com/kubernetes-sigs/kustomize"
      path: examples/helloWorld
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true      
